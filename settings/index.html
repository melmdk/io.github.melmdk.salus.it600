<!DOCTYPE html>
<html>
  <head>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  </head>
  <body>
    <header class="homey-header">
      <h1 class="homey-title">Salus IT600</h1>
      <p class="homey-subtitle">Gateway Connection</p>
    </header>

    <fieldset class="homey-form-fieldset">
      <legend class="homey-form-legend">Gateway</legend>

      <div class="homey-form-group">
        <label class="homey-form-label" for="host">Gateway IP Address</label>
        <input class="homey-form-input" id="host" type="text" placeholder="192.168.1.100" />
        <small class="homey-form-hint">Local IP address of your UG600/UGE600 gateway</small>
      </div>

      <div class="homey-form-group">
        <label class="homey-form-label" for="euid">Gateway EUID</label>
        <input class="homey-form-input" id="euid" type="text" placeholder="16 characters from the gateway label" />
        <small class="homey-form-hint">Identifier printed on the gateway label</small>
      </div>

      <div class="homey-form-group">
        <label class="homey-form-checkbox">
          <input class="homey-form-checkbox-input" id="combined" type="checkbox" checked />
          <span class="homey-form-checkbox-checkmark"></span>
          <span class="homey-form-checkbox-text">Use combined device requests</span>
        </label>
        <small class="homey-form-hint">Fetches all device details in one request. If the gateway doesn't answer it, the app falls back to one request per device type on its own.</small>
      </div>
    </fieldset>

    <button id="save" class="homey-button-primary-full">Save &amp; Connect</button>

    <div id="status" style="margin-top:16px; display:none;"></div>

    <script type="text/javascript">
      function onHomeyReady(Homey) {
        var hostEl = document.getElementById('host');
        var euidEl = document.getElementById('euid');
        var combinedEl = document.getElementById('combined');
        var saveEl = document.getElementById('save');
        var statusEl = document.getElementById('status');
        var waiting = null;
        // `at` nonce of the save being applied; the app echoes it in that save's gateway_status.
        var pendingSave = null;
        var WRONG_EUID = 'Wrong EUID: check the 16 characters on the gateway label';

        function showStatus(msg, ok) {
          statusEl.textContent = msg;
          statusEl.className = ok ? 'homey-form-success' : 'homey-form-error';
          statusEl.style.display = 'block';
        }

        function setBusy(busy) {
          saveEl.disabled = busy;
          saveEl.textContent = busy ? 'Connecting…' : 'Save & Connect';
        }

        function stopWaiting() {
          if (waiting) clearTimeout(waiting);
          waiting = null;
          pendingSave = null;
          setBusy(false);
        }

        // The app writes the outcome of every connect to gateway_status. While a
        // save is being applied, only the status that answers it counts: a
        // background reconnect of the old gateway may report in the meantime.
        function loadStatus() {
          Homey.get('gateway_status', function(err, status) {
            if (err || !status || !status.message) return;
            if (waiting && status.input !== pendingSave) return;
            showStatus(status.message, status.ok);
            if (waiting) stopWaiting();
          });
        }

        Homey.on('settings.set', function(key) {
          if (key === 'gateway_status') loadStatus();
        });

        Homey.get('gateway', function(err, gateway) {
          if (!err && gateway) {
            if (gateway.host) hostEl.value = gateway.host;
            if (gateway.euid) euidEl.value = gateway.euid;
            // On unless switched off; older versions stored no preference.
            combinedEl.checked = gateway.combinedDetails !== false;
          }
          loadStatus();
          Homey.ready();
        });

        saveEl.addEventListener('click', function() {
          var host = hostEl.value.trim();
          // Same normalisation as the app (normaliseEuid): no whitespace, uppercase.
          var euid = euidEl.value.replace(/\s+/g, '').toUpperCase();

          if (!host) return showStatus('Gateway IP address is required.', false);
          if (!euid) return showStatus('Gateway EUID is required.', false);
          // Gateway labels carry 16 hex characters (some 12); anything else cannot work.
          if (!/^(?:[0-9A-F]{12}|[0-9A-F]{16})$/.test(euid)) return showStatus(WRONG_EUID, false);

          setBusy(true);
          statusEl.style.display = 'none';
          // One change: the app reconnects once, with the new IP, EUID and request mode together.
          // `at` makes every save a new value, so re-saving the same pair still reconnects,
          // and the app echoes it in the status that answers this save.
          var input = { host: host, euid: euid, combinedDetails: combinedEl.checked, at: Date.now() };
          pendingSave = input.at;
          // Started before saving: the app may answer before the save callback runs.
          waiting = setTimeout(function() {
            stopWaiting();
            showStatus('Saved. Still waiting for the gateway to answer.', false);
          }, 45000);

          Homey.set('gateway_input', input, function(err) {
            if (err) {
              stopWaiting();
              showStatus('Failed to save: ' + err.message, false);
            }
          });
        });
      }
    </script>
  </body>
</html>
